[project]
name = "mytabletop-backend"
version = "0.1.0"
description = "MyTabletop VTT backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "beanie>=2.0",
    "pydantic>=2.8",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mongomock-motor>=0.0.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
